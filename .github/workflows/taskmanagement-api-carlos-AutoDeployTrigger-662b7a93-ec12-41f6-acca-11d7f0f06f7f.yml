name: Trigger auto deployment for taskmanagement-api-carlos

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/taskmanagement-api-carlos-AutoDeployTrigger-662b7a93-ec12-41f6-acca-11d7f0f06f7f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TASKMANAGEMENTAPICARLOS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TASKMANAGEMENTAPICARLOS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TASKMANAGEMENTAPICARLOS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
              appSourcePath: ${{ github.workspace }}/backend
              dockerfilePath: Dockerfile
              registryUrl: docker.io
              registryUsername: ${{ secrets.TASKMANAGEMENTAPICARLOS_REGISTRY_USERNAME }}
              registryPassword: ${{ secrets.TASKMANAGEMENTAPICARLOS_REGISTRY_PASSWORD }}
              containerAppName: taskmanagement-api-carlos
              resourceGroup: rg-task-management
              imageToBuild: kbto1989/task-management-api:${{ github.sha }}
              imageToDeploy: kbto1989/task-management-api:${{ github.sha }}
              targetPort: 8080
              ingress: external


